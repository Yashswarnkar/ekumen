id: D-apply-amend-lane
title: Who writes the §B amendments that decision apply adds
tier: 2
raised_by: {task: T-cli-gaps, session: t-cli-gaps, on: 2026-11-20}
question: |
  Applying a decision adds a §B amendment (TaskAmended) to each task in `blocks` (C-decision-record §3), but C-event-log §3 puts TaskAmended in the orchestrator's lane only, while DecisionApplied is the loop's. Who writes those TaskAmended events, now and once the loop exists?
options:
  - {id: orchestrator-same-session, tradeoff: 'Implemented in T-cli-gaps. `decision apply`, run as loop:<s>, records the amendments as orchestrator:<s> and refuses unless <s> holds the orchestrator claim. No contract change, check stays clean, but one command writes as two actors, and the real loop (T-reconcile) could not apply a decision that blocks tasks without also holding the orchestrator claim.'}
  - {id: loop-lane, tradeoff: 'Add TaskAmended to the loop''s lane in C-event-log §3 (only for amendments made by applying a decision, note `applies D-…`). The loop applies on its own; a minor lane widening, but it needs a contract version.'}
  - {id: applied-carries-files, tradeoff: 'No TaskAmended for applies: DecisionApplied records the amendment files and their hashes. Keeps lanes, but changes the DecisionApplied payload and the brief view must read two event types.'}
recommendation: loop-lane
default_if_no_answer: null
