id: D-017
title: How Ekumen authenticates to Claude Code
tier: 2
raised_by: {task: R1, session: r1-acp, on: 2026-11-20}
question: >
  Anthropic does not allow third-party products to offer claude.ai login or rate limits (including Agent SDK apps,
  which claude-agent-acp is) unless approved. How does Ekumen drive Claude Code?
options:
  - {id: drive-installed-cli, tradeoff: Ekumen runs the lead's own installed `claude` binary under the lead's own login; Ekumen never handles credentials}
  - {id: api-key-only-acp, tradeoff: claude-agent-acp with ANTHROPIC_API_KEY only; clean on terms; costs API spend}
  - {id: seek-approval, tradeoff: Ask Anthropic; slow, uncertain}
recommendation: drive-installed-cli
context:
  summary: >
    For personal use, running one's own CLI is the safe default. Never ship or broker Claude credentials.
    Revisit the terms before the first public release, because distribution is what the rule is about.
  evidence: [.ekumen/research/R1-acp.md, "https://code.claude.com/docs/en/agent-sdk/overview"]
blocks: []
contract_impact: [C4]
status: pending
answer: null
