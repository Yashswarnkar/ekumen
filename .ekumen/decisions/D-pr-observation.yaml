question: |
  Observation runs `gh pr list --limit 200` with no truncation signal, and twice per write (GitHub #15). Past 200 PRs, done tasks regress. Reconcile observes on every pass. What strategy?
options:
  - {id: once-paginated, tradeoff: 'Observe once per command, reusing the snapshot in commit. Page through all PRs, or open PRs plus merged PRs for known task branches. Warn if anything is truncated. Projections never depend on a second network call.'}
  - {id: once-capped-warn, tradeoff: 'Observe once per command, keep the cap and warn at it. Simplest, but it still regresses on large repos.'}
  - {id: cached, tradeoff: 'Cache observations with a short TTL. Fewer calls, but results can be stale.'}
recommendation: once-paginated
