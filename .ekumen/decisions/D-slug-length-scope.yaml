id: D-slug-length-scope
title: Does the 40-character limit in C-event-log §1 cover the slug or the whole id?
tier: 2
raised_by:
  task: T-file-store
  session: t-file-store
  on: 2026-11-20
question: C-event-log §1 says "slug ... ≤ 40 characters in total" and the regex has
  no length. Is the limit on the slug after "<letter>-" (id ≤ 42) or on the whole
  id (≤ 40)?
options:
- id: slug-only
  tradeoff: 'Matches the wording ''slug: ... ≤ 40''. Ids can be up to 42 characters.'
- id: whole-id
  tradeoff: Simpler to state, but 'T-' takes 2 of the 40 characters.
recommendation: slug-only
default_if_no_answer: 
deadline: 
blocks: []
contract_impact:
- C-event-log
context:
  summary: The store validates ids before using them in paths. It currently enforces
    slug-only (internal/store/files/validate.go, maxSlugLen). T-core validates ids
    too, and the two must agree. Clarifying the wording is enough; no data changes.
  evidence:
  - ".ekumen/contracts/C-event-log.md#1-ids"
  - internal/store/files/validate.go
status: decided
answer: slug-only
answer_note: As recommended.
decided_by: lead
decided_on: 2026-11-20
