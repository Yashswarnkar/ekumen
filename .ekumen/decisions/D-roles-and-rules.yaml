id: D-roles-and-rules
title: Make roles and rules Ekumen's extension point
tier: 2
raised_by: {task: null, session: main, on: 2026-11-20}
question: |
  Kinds of agent work (review, research, audit, test, release…) are today one-off briefs that start only when the orchestrator remembers. Should Ekumen let each project declare reusable roles and the rules that start them, as plain files the control loop evaluates in code?
options:
  - {id: roles-and-rules, tradeoff: "Two small file kinds: a role (prompt, grants, output lane, escalation) and a rule (when / if / start / gate). The loop evaluates rules without tokens and starts roles through adapters; outputs enter through existing lanes. Ekumen stays a coordination layer and never builds reviewers or testers itself. Needs a new contract (C-roles), rule evaluation in T-reconcile, and an adapter to start sessions.\n"}
  - {id: briefs-only, tradeoff: "Keep one-off briefs (as T-audit is). No new concepts, but recurring work depends on someone remembering, and nothing gates a merge on a review.\n"}
  - {id: hardcoded-roles, tradeoff: "Build a fixed set (reviewer, tester, auditor) into Ekumen. Quick for the common cases, but every new kind of work needs a code change, and it pulls Ekumen into doing the work instead of coordinating it.\n"}
recommendation: roles-and-rules
default_if_no_answer: null
