context:
  summary: |
    Raised from the lead's observation that most PRs go unreviewed and that research and other work need their own kinds of agents. T-audit showed a new role can be added in minutes as a brief; what's missing is reuse and triggers. Until rules run, the orchestrator runs /code-review on each PR by hand before asking to merge.
