question: |
  A role claim clears only when its holder releases it (GitHub #13). A crashed orchestrator blocks every orchestrator write. Two sessions also both claimed as "orchestrator:main", so the claim protected nothing. How are claims broken, and how are holders told apart?
options:
  - {id: lead-takeover-unique-ids, tradeoff: '`ekumen claim --takeover <role>` (lead lane) releases the old holder and records the new claim. Claims must use a session id that isn''t a generic word (main, default), and check warns otherwise. Liveness from the adapter can come later.'}
  - {id: leases, tradeoff: 'Claims expire unless renewed on each write. Automatic, but a slow session silently loses its role.'}
  - {id: adapter-liveness, tradeoff: The loop releases claims whose session the adapter reports dead. Needs a working adapter first.}
