id: D-015
title: Agent adapter base. ACP, native, or both?
tier: 2
raised_by: {task: R1, session: r1-acp, on: 2026-11-20}
question: Should Ekumen's agent adapters be built on ACP, on each tool's native CLI/SDK, or both?
options:
  - {id: acp-only, tradeoff: One driver for all tools; cannot see or message lead-started sessions; fork/status unstable in ACP v1}
  - {id: acp-plus-native, tradeoff: Uniform control of owned sessions plus native observers for all sessions; two paths per tool}
  - {id: native-only, tradeoff: Fewest dependencies, fastest v0.1; N bespoke drivers; ignores the standard surface of Gemini, Cursor and Copilot}
recommendation: acp-plus-native
context:
  summary: >
    ACP (spec 1.19.0, Apache-2.0, Zed + JetBrains) is healthy, but its Claude and Codex adapters start their own
    private agent process, so they cannot see or message sessions the lead opened in a terminal. Fork and status are
    unstable in v1. Plan: v0.1 ships a native Claude Code adapter only; a generic ACP driver arrives with the
    dispatcher, with a small native status reader per tool.
  evidence: [.ekumen/research/R1-acp.md]
blocks: []
contract_impact: [C4]
status: decided
answer: acp-plus-native
answer_note: "As recommended."
decided_by: lead
decided_on: 2026-11-20
