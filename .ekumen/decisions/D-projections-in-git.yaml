id: D-projections-in-git
title: Which generated files are committed to git
tier: 2
raised_by: {task: null, session: main, on: 2026-11-20}
question: |
  Every ekumen write regenerates registry.yaml and state.json, which aggregate the whole project. Two branches that each record one event therefore always conflict in git, which breaks C-event-log's promise that git never sees two writers on one file. Which generated files stay in git?
options:
  - {id: per-item-only, tradeoff: "Keep per-item files (decisions/<id>.yaml) committed, since two branches rarely touch the same decision, and stop committing the aggregates (registry.yaml, state.json), which every command can regenerate. Readable on GitHub per decision; no routine conflicts. CI checks the committed per-item files match the events.\n"}
  - {id: ignore-all, tradeoff: "Commit only events and prose. Every generated file is local (git-ignored). Zero conflicts, but nothing is readable on GitHub without running ekumen.\n"}
  - {id: keep-all-regenerate, tradeoff: "Keep committing everything. On conflict, take either side and run `ekumen project`. CI fails if the files are stale. Readable, but every parallel PR needs a manual fix-up.\n"}
recommendation: per-item-only
default_if_no_answer: null
