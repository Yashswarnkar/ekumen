question: |
  Decision priority (C-decision-record §1) counts every task downstream of a decision, including through contracts in contract_impact. So the lead's inbox says "blocks 14 tasks" (p=14) for D-claim-takeover, D-lane-check-history and D-write-atomicity. Six of those tasks are merged and done, and only one (T-loop-hardening) actually waits on them. Should the count include only tasks that are not done and that the decision actually gates?
options:
  - {id: open-gated-only, tradeoff: 'Count tasks that are not done or deferred (done from observed PRs, as status already uses) and that name the decision, directly or through a contract that is still draft or being versioned. The numbers become honest. Needs C-decision-record v3 text and a code change in core.BlockedByDecision.'}
  - {id: exclude-done-only, tradeoff: 'Keep the reach through contract_impact, but drop done tasks. Smaller change. Frozen-contract fan-out still inflates contract-change decisions.'}
  - {id: keep, tradeoff: 'No change. The inbox keeps ranking by reach, not by waiting work, and the lead must check each count by hand.'}
