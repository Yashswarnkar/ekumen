question: |
  Lane checks for past events use the final state (GitHub #14), so re-attaching a task to a new session makes the old session's legitimate handoffs look like lane violations. Since the control loop now raises a tier-2 decision for every conflict, this would flood the lead with false alarms. Which rule applies?
options:
  - {id: state-at-write, tradeoff: 'Evaluate each event against the state reduced up to just before it, as the CLI already does at write time. Re-attachment ends the old session''s ownership from that point on, including the drafting session''s. Costs an incremental reduce in check.'}
  - {id: session-history, tradeoff: 'Keep each task''s attached sessions with time ranges and check against them. Same result, more bookkeeping.'}
recommendation: state-at-write
