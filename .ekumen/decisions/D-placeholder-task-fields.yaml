question: |
  T-skills, T-reconcile, T-claude-adapter, T-server, T-graph-view and T-decision-views were imported as drafts with empty repo, base_branch, branch and worktree. `task draft` refuses an id already in use, and no command sets these fields, so these tasks can be approved but never derive `ready`. How should the orchestrator fill them?
options:
  - {id: task-update, tradeoff: 'New orchestrator-lane event TaskUpdated (repo, base_branch, branch, worktree, title, tier_grants) allowed only before approval, plus `ekumen task update`. Small; needs C-event-log and C-cli-json versions.'}
  - {id: redraft-unapproved, tradeoff: 'Allow `task draft` on an id whose task is unapproved; the newer TaskDrafted replaces fields. No new event type, but bends ''first draft wins'' and the id-collision rule.'}
  - {id: defer-and-new-ids, tradeoff: 'Defer the placeholders and draft new tasks with new ids. No code change; churns ids that the spine, decisions and graph already use.'}
recommendation: task-update
