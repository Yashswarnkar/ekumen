question: |
  `claude --bg` in a directory the user has not trusted exits 1 with "Workspace not trusted. Run `claude` in <dir> once and accept the trust prompt, then retry." and starts nothing. Every fresh task worktree is untrusted, and accepting trust writes Claude Code's own user config, which the adapter must never touch (D-claude-auth). What should Start do?
options:
  - {id: unsupported-then-paste, tradeoff: 'Start detects the message and returns ErrUnsupported (nothing started), so the loop uses the C-adapter §3 "start this task" inbox item; the lead runs claude in the worktree once, accepting trust, and later Starts work. No contract change; first start of every task needs the lead.'}
  - {id: lead-trusts-worktree-root, tradeoff: 'Same code path, plus a one-time setup step in the README: the lead trusts a parent directory that holds all worktrees, if Claude Code honours trust on parents. Not verified on 2.1.329: a gitignored folder under the repo was untrusted, so parent inheritance is unproven.'}
  - {id: adapter-accepts-trust, tradeoff: Fully automatic}
recommendation: unsupported-then-paste
