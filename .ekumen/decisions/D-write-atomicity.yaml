id: D-write-atomicity
title: How writes stay all-or-nothing and safe with concurrent writers
tier: 2
raised_by: {task: null, session: claude-pkg-7e, on: 2026-11-20}
question: |
  Multi-event writes append one file at a time with an in-process rollback, and there is no write lock (GitHub #12). A crash leaves partial batches; two ekumen processes can both pass validation. With the control loop writing many events per pass alongside the orchestrator, which protection do we adopt?
options:
  - {id: lock-and-commit-last, tradeoff: 'An exclusive lock on .ekumen/.lock around load, validate and append fixes concurrent writers. Each write orders a final ''commit'' event last, and check flags partial batches and orphan entries. Small; no storage-rule change.'}
  - {id: journal, tradeoff: 'Stage files and write a commit record last; readers ignore uncommitted batches. Fully crash-atomic, but it changes C-event-log storage rules.'}
  - {id: lock-only, tradeoff: Fixes concurrency only; crashes still leave partial batches.}
recommendation: lock-and-commit-last
