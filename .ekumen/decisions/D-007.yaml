id: D-007
title: Code over tokens
tier: 2
raised_by: {task: vision, session: lead, on: 2026-11-19}
question: Should agents do deterministic work such as graph drawing, queries, status and routing?
options:
  - {id: code-first, tradeoff: Deterministic, cheap, testable; more code to write}
  - {id: agent-does-it, tradeoff: Less code to write; costs tokens on every run, results vary, hard to test}
context:
  summary: >
    The lead's principle: deterministic work (graph layout, queries, status, routing) is software, and agents are used only for judgment, to save tokens and keep results reproducible.
status: decided
answer: code-first
answer_note: Agents only for judgment; everything deterministic is software exposed via ekumen CLI --json.
decided_by: lead
decided_on: 2026-11-19
