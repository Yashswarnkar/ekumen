question: |
  On this machine a managed setting `allowManagedHooksOnly` is on, so command hooks passed with `--settings` never run (debug log: "Skipping plugin hooks - allowManagedHooksOnly is enabled"). D-claude-status-source chose hooks plus listing. Should the adapter treat hooks as an optional enrichment and make `claude agents --json` the primary status source?
options:
  - {id: listing-primary-hooks-optional, tradeoff: 'Works under any policy. Hook records refine needs_input (tool name, question) when present; without them status comes from the listing only, and needs_input from the listing stays marked "unverified signal" until a probe observes it. Loses the hook-only signals (elicitation, exact permission tool) on locked-down machines.'}
  - {id: hooks-required, tradeoff: 'Keeps D-claude-status-source as written, but Start would have to refuse (or status degrade to unknown) wherever policy blocks hooks, which is common in managed enterprise setups.'}
recommendation: listing-primary-hooks-optional
default_if_no_answer: null
