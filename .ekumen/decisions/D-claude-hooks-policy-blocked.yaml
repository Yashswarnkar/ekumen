context:
  summary: |
    Hands-on on claude 2.1.329 (T-claude-adapter probe): a `-p` run with `--settings` registering SessionStart, UserPromptSubmit, Stop and others wrote no hook records; `--debug-file` shows managed policy skipping non-managed hooks while the organisation's own managed hook ran. The adapter already maps status from the listing alone and uses hook records only when they exist, so it ships as listing-primary; this asks the lead to confirm that reading of D-claude-status-source.
