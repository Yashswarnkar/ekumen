id: D-apply-before-loop
title: Add a manual `ekumen decision apply` until the loop exists
tier: 2
raised_by: {task: T-cli, session: t-cli, on: 2026-11-20}
question: |
  A decided decision keeps blocking its tasks until DecisionApplied (C-decision-record §3), which only the loop writes, and no CLI command writes it. Until T-reconcile ships, every task gated by a decided decision stays blocked. How should decisions be applied before then?
options:
  - {id: apply-command, tradeoff: 'Add `ekumen decision apply <id>`, run by the orchestrator as `--as loop:<session>`. It writes DecisionApplied and the §B amendments. Small minor addition to C-cli-json.'}
  - {id: wait-for-loop, tradeoff: 'No change. T-reconcile becomes urgent, and statuses read "blocked" for decided work until it ships.'}
  - {id: decided-clears, tradeoff: 'Treat decided as cleared in core. Simplest, but it changes C-decision-record §3 semantics.'}
recommendation: apply-command
default_if_no_answer: null
deadline: null
blocks: [T-skills, T-reconcile]
contract_impact: [C-cli-json]
context:
  summary: |
    Seen in the end-to-end run: after `decision answer`, the task stays "blocked" by the decision. The orchestrator can't clear it with `task block --remove` either, because core also blocks through the decision's own `blocks`.
  evidence: [internal/core/status.go, internal/cli/cli_test.go]
status: decided
