id: D-011
title: Where research lives
tier: 2
raised_by: {task: R1, session: lead, on: 2026-11-20}
question: Should research reports live in docs/ or inside .ekumen/?
options:
  - {id: ekumen-research, tradeoff: Research is the phase before a project; it is evidence for the spine and decisions and belongs with them}
  - {id: docs, tradeoff: Keeps .ekumen/ to coordination state only}
recommendation: ekumen-research
status: decided
answer: ekumen-research
answer_note: Research is a first-class task kind; outputs go to .ekumen/research/<task-id>-<slug>.md and are cited as evidence.
decided_by: lead
decided_on: 2026-11-20
